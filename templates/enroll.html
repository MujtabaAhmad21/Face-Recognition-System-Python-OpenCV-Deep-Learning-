<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enroll a new person into the face recognition system — capture reference photos from your webcam.">
    <title>Face Recognition — Enroll New Person</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 3H5a2 2 0 0 0-2 2v4"/>
                        <path d="M15 3h4a2 2 0 0 1 2 2v4"/>
                        <path d="M9 21H5a2 2 0 0 1-2-2v-4"/>
                        <path d="M15 21h4a2 2 0 0 0 2-2v-4"/>
                        <circle cx="12" cy="10" r="3"/>
                        <path d="M7 16.5c0-2.5 2.2-4 5-4s5 1.5 5 4"/>
                    </svg>
                </div>
                <h1>Face Recognition</h1>
            </div>
            <nav class="header-nav">
                <a href="/" class="nav-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    Live Feed
                </a>
                <a href="/enroll" class="nav-link active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                    Enroll
                </a>
                <a href="/people" class="nav-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    Manage
                </a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main-content" style="grid-template-columns: 1fr;">
            <div class="enroll-container">
                <div class="enroll-card">
                    <h2>Enroll New Person</h2>
                    <p class="subtitle">Capture 3–5 reference photos to teach the system a new face.</p>

                    <div id="message-area"></div>

                    <!-- Name Input -->
                    <div class="form-group">
                        <label for="person-name">Person's Name</label>
                        <input type="text" id="person-name" placeholder="e.g. Alice, Bob..." autocomplete="off">
                    </div>

                    <!-- Capture Instructions -->
                    <div class="capture-instruction">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        Shift your angle and expression slightly between each capture for better accuracy.
                    </div>

                    <!-- Live Preview -->
                    <div class="capture-area">
                        <div class="capture-preview-wrapper">
                            <img id="capture-preview" alt="Live camera preview for enrollment">
                            <script>
                                const capturePreview = document.getElementById('capture-preview');
                                const captureState = { active: false, stream: null, timer: null, video: null, canvas: null, ctx: null, lastDataUrl: null };

                                async function startCapturePreview() {
                                    if (captureState.active) return;
                                    try {
                                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                                        captureState.stream = stream;
                                        captureState.active = true;
                                        captureState.video = document.createElement('video');
                                        captureState.video.autoplay = true;
                                        captureState.video.playsInline = true;
                                        captureState.video.muted = true;
                                        captureState.video.srcObject = stream;
                                        await captureState.video.play();
                                        captureState.canvas = document.createElement('canvas');
                                        captureState.ctx = captureState.canvas.getContext('2d');

                                        function renderPreview() {
                                            if (!captureState.active || !captureState.ctx) return;
                                            captureState.canvas.width = 640;
                                            captureState.canvas.height = 480;
                                            captureState.ctx.drawImage(captureState.video, 0, 0, 640, 480);
                                            captureState.lastDataUrl = captureState.canvas.toDataURL('image/jpeg', 0.85);
                                            capturePreview.src = captureState.lastDataUrl;
                                        }

                                        captureState.timer = setInterval(renderPreview, 120);
                                    } catch (error) {
                                        console.error('Capture preview failed', error);
                                    }
                                }

                                async function stopCapturePreview() {
                                    captureState.active = false;
                                    if (captureState.timer) clearInterval(captureState.timer);
                                    if (captureState.stream) {
                                        captureState.stream.getTracks().forEach(track => track.stop());
                                    }
                                    captureState.stream = null;
                                }

                                document.addEventListener('visibilitychange', async () => {
                                    if (document.hidden) {
                                        await stopCapturePreview();
                                    } else {
                                        await startCapturePreview();
                                    }
                                });

                                window.addEventListener('pageshow', startCapturePreview);
                                startCapturePreview();
                            </script>
                        </div>
                        <div class="capture-controls">
                            <button id="capture-btn" class="btn btn-capture" onclick="captureFrame()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                    <circle cx="12" cy="13" r="4"/>
                                </svg>
                                Capture
                            </button>
                            <span class="capture-count" id="capture-count">0 / 5 captured</span>
                        </div>
                    </div>

                    <!-- Thumbnails of captured photos -->
                    <div class="thumbnails" id="thumbnails"></div>

                    <!-- Submit -->
                    <button id="submit-btn" class="btn btn-submit" onclick="submitEnrollment()" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Save & Start Recognizing
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const MAX_CAPTURES = 5;
        const MIN_CAPTURES = 3;
        let capturedBlobs = [];

        function showMessage(text, type) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="message message-${type}">${text}</div>`;
            if (type === 'success') {
                setTimeout(() => { window.location.href = '/'; }, 2000);
            }
        }

        async function captureFrame() {
            const name = document.getElementById('person-name').value.trim();
            if (!name) {
                showMessage('Please enter a name first.', 'error');
                return;
            }

            if (capturedBlobs.length >= MAX_CAPTURES) {
                showMessage('Maximum captures reached. Submit to save.', 'error');
                return;
            }

            try {
                if (!captureState.canvas || !captureState.ctx || !captureState.video || captureState.video.readyState < 2) {
                    showMessage('Camera preview is not ready yet. Please wait a moment and try again.', 'error');
                    return;
                }

                captureState.canvas.width = 640;
                captureState.canvas.height = 480;
                captureState.ctx.drawImage(captureState.video, 0, 0, 640, 480);
                const blob = await new Promise((resolve, reject) => {
                    captureState.canvas.toBlob((result) => {
                        if (result) {
                            resolve(result);
                        } else {
                            reject(new Error('Could not create image blob'));
                        }
                    }, 'image/jpeg', 0.9);
                });

                capturedBlobs.push(blob);

                // Add thumbnail
                const url = URL.createObjectURL(blob);
                const thumbs = document.getElementById('thumbnails');
                const div = document.createElement('div');
                div.className = 'thumbnail';
                div.innerHTML = `<img src="${url}" alt="Capture ${capturedBlobs.length}">`;
                thumbs.appendChild(div);

                // Update count
                const count = capturedBlobs.length;
                document.getElementById('capture-count').textContent = `${count} / ${MAX_CAPTURES} captured`;

                // Enable submit if enough captures
                document.getElementById('submit-btn').disabled = count < MIN_CAPTURES;

                // Disable capture if max reached
                if (count >= MAX_CAPTURES) {
                    document.getElementById('capture-btn').disabled = true;
                }
            } catch (err) {
                showMessage('Failed to capture frame. Is the camera running?', 'error');
            }
        }

        async function submitEnrollment() {
            const name = document.getElementById('person-name').value.trim();
            if (!name) {
                showMessage('Please enter a name.', 'error');
                return;
            }

            if (capturedBlobs.length < MIN_CAPTURES) {
                showMessage(`Please capture at least ${MIN_CAPTURES} photos.`, 'error');
                return;
            }

            // Disable buttons during submission
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('capture-btn').disabled = true;
            document.getElementById('submit-btn').textContent = 'Saving...';

            const formData = new FormData();
            formData.append('name', name);
            capturedBlobs.forEach((blob, i) => {
                formData.append('images', blob, `${name}_${i + 1}.jpg`);
            });

            try {
                const resp = await fetch('/enroll', {
                    method: 'POST',
                    body: formData,
                });
                const data = await resp.json();

                if (data.success) {
                    showMessage(data.message + ' Redirecting...', 'success');
                } else {
                    showMessage(data.error || 'Enrollment failed.', 'error');
                    document.getElementById('submit-btn').disabled = false;
                    document.getElementById('submit-btn').textContent = 'Save & Start Recognizing';
                }
            } catch (err) {
                showMessage('Network error during enrollment.', 'error');
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').textContent = 'Save & Start Recognizing';
            }
        }
    </script>
</body>
</html>
