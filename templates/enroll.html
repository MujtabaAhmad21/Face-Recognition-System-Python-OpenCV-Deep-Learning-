<!DOCTYPE html>
<html lang="en" class="lenis">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enroll a new person into the face recognition system.">
    <title>Face Recognition — Enroll</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 3H5a2 2 0 0 0-2 2v4"/>
                        <path d="M15 3h4a2 2 0 0 1 2 2v4"/>
                        <path d="M9 21H5a2 2 0 0 1-2-2v-4"/>
                        <path d="M15 21h4a2 2 0 0 0 2-2v-4"/>
                        <circle cx="12" cy="10" r="3"/>
                        <path d="M7 16.5c0-2.5 2.2-4 5-4s5 1.5 5 4"/>
                    </svg>
                </div>
                <h1>Face Recognition</h1>
            </div>
            <nav class="header-nav">
                <a href="/" class="nav-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                    Live Feed
                </a>
                <a href="/enroll" class="nav-link active">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                    Enroll
                </a>
                <a href="/people" class="nav-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Manage
                </a>
            </nav>
        </header>

        <main class="main-content" style="grid-template-columns: 1fr;">
            <div class="enroll-container">
                <div class="enroll-card">
                    <h2>Enroll New Person</h2>
                    <p class="subtitle">Capture 3–5 reference photos to train the recognition model.</p>

                    <div id="message-area"></div>

                    <div class="form-group">
                        <label for="person-name">Name</label>
                        <input type="text" id="person-name" placeholder="e.g. Alice, Bob..." autocomplete="off">
                    </div>

                    <div class="capture-instruction">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        Vary your angle and expression between each capture.
                    </div>

                    <div class="capture-area">
                        <div class="capture-preview-wrapper">
                            <img id="capture-preview" alt="Camera preview">
                            <script>
                                const capturePreview = document.getElementById('capture-preview');
                                const captureState = { active: false, stream: null, timer: null, video: null, canvas: null, ctx: null, lastDataUrl: null };

                                async function startCapturePreview() {
                                    if (captureState.active) return;
                                    try {
                                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                                        captureState.stream = stream;
                                        captureState.active = true;
                                        captureState.video = document.createElement('video');
                                        captureState.video.autoplay = true;
                                        captureState.video.playsInline = true;
                                        captureState.video.muted = true;
                                        captureState.video.srcObject = stream;
                                        await captureState.video.play();
                                        captureState.canvas = document.createElement('canvas');
                                        captureState.ctx = captureState.canvas.getContext('2d');

                                        function renderPreview() {
                                            if (!captureState.active || !captureState.ctx) return;
                                            captureState.canvas.width = 640;
                                            captureState.canvas.height = 480;
                                            captureState.ctx.drawImage(captureState.video, 0, 0, 640, 480);
                                            captureState.lastDataUrl = captureState.canvas.toDataURL('image/jpeg', 0.85);
                                            capturePreview.src = captureState.lastDataUrl;
                                        }

                                        captureState.timer = setInterval(renderPreview, 120);
                                    } catch (error) {
                                        console.error('Capture preview failed', error);
                                    }
                                }

                                async function stopCapturePreview() {
                                    captureState.active = false;
                                    if (captureState.timer) clearInterval(captureState.timer);
                                    if (captureState.stream) {
                                        captureState.stream.getTracks().forEach(track => track.stop());
                                    }
                                    captureState.stream = null;
                                }

                                document.addEventListener('visibilitychange', async () => {
                                    if (document.hidden) await stopCapturePreview();
                                    else await startCapturePreview();
                                });
                                window.addEventListener('pageshow', startCapturePreview);
                                startCapturePreview();
                            </script>
                        </div>
                        <div class="capture-controls">
                            <button id="capture-btn" class="btn btn-capture" onclick="captureFrame()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                Capture
                            </button>
                            <span class="capture-count" id="capture-count">0 / 5 captured</span>
                        </div>
                    </div>

                    <div class="thumbnails" id="thumbnails"></div>

                    <button id="submit-btn" class="btn btn-submit" onclick="submitEnrollment()" disabled>
                        Save & Train Model
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const MAX_CAPTURES = 5;
        const MIN_CAPTURES = 3;
        let capturedBlobs = [];

        function showMessage(text, type) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="message message-${type}">${text}</div>`;
            if (type === 'success') setTimeout(() => { window.location.href = '/'; }, 1800);
        }

        async function captureFrame() {
            const name = document.getElementById('person-name').value.trim();
            if (!name) { showMessage('Please enter a name first.', 'error'); return; }
            if (capturedBlobs.length >= MAX_CAPTURES) { showMessage('Maximum captures reached.', 'error'); return; }

            try {
                if (!captureState.canvas || !captureState.ctx || !captureState.video || captureState.video.readyState < 2) {
                    showMessage('Camera initializing, please wait...', 'error'); return;
                }
                captureState.canvas.width = 640;
                captureState.canvas.height = 480;
                captureState.ctx.drawImage(captureState.video, 0, 0, 640, 480);
                const blob = await new Promise((resolve, reject) => {
                    captureState.canvas.toBlob((r) => r ? resolve(r) : reject(new Error('Blob failed')), 'image/jpeg', 0.9);
                });

                capturedBlobs.push(blob);
                const url = URL.createObjectURL(blob);
                const thumbs = document.getElementById('thumbnails');
                const div = document.createElement('div');
                div.className = 'thumbnail';
                div.innerHTML = `<img src="${url}" alt="Capture ${capturedBlobs.length}">`;
                thumbs.appendChild(div);

                if (typeof gsap !== 'undefined') {
                    gsap.from(div, { scale: 0.6, opacity: 0, duration: 0.35, ease: 'back.out(1.7)' });
                }

                const count = capturedBlobs.length;
                document.getElementById('capture-count').textContent = `${count} / ${MAX_CAPTURES} captured`;
                document.getElementById('submit-btn').disabled = count < MIN_CAPTURES;
                if (count >= MAX_CAPTURES) document.getElementById('capture-btn').disabled = true;
            } catch (err) {
                showMessage('Failed to capture frame.', 'error');
            }
        }

        async function submitEnrollment() {
            const name = document.getElementById('person-name').value.trim();
            if (!name) { showMessage('Please enter a name.', 'error'); return; }
            if (capturedBlobs.length < MIN_CAPTURES) { showMessage(`Capture at least ${MIN_CAPTURES} photos.`, 'error'); return; }

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('capture-btn').disabled = true;
            document.getElementById('submit-btn').textContent = 'Saving...';

            const formData = new FormData();
            formData.append('name', name);
            capturedBlobs.forEach((blob, i) => formData.append('images', blob, `${name}_${i + 1}.jpg`));

            try {
                const resp = await fetch('/enroll', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.success) {
                    showMessage(data.message + ' Redirecting...', 'success');
                } else {
                    showMessage(data.error || 'Enrollment failed.', 'error');
                    document.getElementById('submit-btn').disabled = false;
                    document.getElementById('submit-btn').textContent = 'Save & Train Model';
                }
            } catch (err) {
                showMessage('Network error.', 'error');
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').textContent = 'Save & Train Model';
            }
        }
    </script>

    {% include 'base_libs.html' %}
</body>
</html>
